
name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      # Step 3: Start test container
      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ci \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:ci

      # Step 4: Test API health endpoint
      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Health check passed."
              exit 0
            fi

            echo "Waiting for API..."
            sleep 3
          done

          echo "Health check failed."
          docker logs student-result-ci
          exit 1

      # Step 5: Remove test container
      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true

      # Step 6: Create lowercase GHCR image name
      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      # Step 7: Login to GHCR
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY \
            -u "${{ github.actor }}" \
            --password-stdin

      # Step 8: Tag tested image
      - name: Tag tested image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:ci $IMAGE_ID:latest
          docker tag ${{ env.IMAGE_NAME }}:ci $IMAGE_ID:sha-${{ github.sha }}

      # Step 9: Push image to GHCR
      - name: Push tested image to GHCR
        run: |
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:sha-${{ github.sha }}
