
name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-ml-ci

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker image
        run: |
          docker build --pull -t "$IMAGE_NAME:ci" .

      # Step 3: Start test container
      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ci \
            -p 8000:5000 \
            "$IMAGE_NAME:ci"

      # Step 4: Test API health endpoint
      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            echo "Health check attempt: $attempt"

            if curl --fail --silent --show-error \
              --max-time 5 \
              http://localhost:8000/health; then
              echo "Health check passed successfully!"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 3
          done

          echo "Health check failed!"
          docker logs student-result-ci
          exit 1

      # Step 5: Remove test container
      - name: Remove test container
        if: always()
        run: |
          docker rm -f student-result-ci || true

      # Step 6: Create lowercase GHCR image name
      - name: Create lowercase GHCR image name
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          echo "IMAGE_ID=${IMAGE_ID}" >> "$GITHUB_ENV"
          echo "Image name: ${IMAGE_ID}"

      # Step 7: Login to GHCR
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # Step 8: Tag tested image
      - name: Tag tested image
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_ID:latest"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_ID:sha-${{ github.sha }}"

      # Step 9: Push tested image to GHCR
      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"

      # Step 10: Confirmation
      - name: Publish confirmation
        run: |
          echo "Docker image published successfully!"
          echo "$IMAGE_ID:latest"
          echo "$IMAGE_ID:sha-${{ github.sha }}"
