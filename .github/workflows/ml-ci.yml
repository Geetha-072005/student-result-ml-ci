
name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build --no-cache -t student-result-prediction:ci .

      # 3. Start test container
      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ci \
            -p 8000:8000 \
            student-result-prediction:ci

      # 4. Check API health
      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            echo "Health check attempt: $attempt"

            if curl --fail --silent --show-error \
              http://localhost:8000/health; then
              echo "Health check passed successfully!"
              exit 0
            fi

            sleep 3
          done

          echo "Health check failed!"
          docker logs student-result-ci
          exit 1

      # 5. Remove test container
      - name: Remove test container
        if: always()
        run: |
          docker rm -f student-result-ci || true

      # 6. Prepare GHCR image name
      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="ghcr.io/${{ github.repository_owner }}/student-result-prediction"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "Image name: $IMAGE_ID"

      # 7. Login to GHCR
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # 8. Tag Docker image
      - name: Tag tested image
        run: |
          docker tag student-result-prediction:ci "$IMAGE_ID:latest"
          docker tag student-result-prediction:ci "$IMAGE_ID:sha-${{ github.sha }}"

      # 9. Push image to GHCR
      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"

      # 10. Display success
      - name: Publish confirmation
        run: |
          echo "Docker image published successfully!"
          echo "$IMAGE_ID:latest"
          echo "$IMAGE_ID:sha-${{ github.sha }}"
